name: Java CI with publishing container
on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build, test & code validation
        run: mvn clean verify
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: petclinic
          path: target/*.jar

  docker:
    needs: [build-test-validate]
    runs-on: ubuntu-latest
    environment:
      name: develop 

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: petclinic
          path: target
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image
        run: |
          docker buildx build -t ${{ secrets.DOCKERHUB_USERNAME }}/petclinic:${GITHUB_HEAD_REF//\//-}-${{ github.run_number }} .
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/petclinic:${GITHUB_HEAD_REF//\//-}-${{ github.run_number }}
